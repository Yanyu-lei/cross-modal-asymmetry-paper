[project]
name = "text-side-fragility"
version = "1.0.0"
description = "Code for the NeurIPS 2026 paper Text-side fragility in contrastive vision-language retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# These are the exact versions the paper's numbers were produced with. uv.lock also fixes
# every package these depend on.
dependencies = [
    "datasets==3.6.0",
    "einops==0.8.2",
    "ftfy==6.3.1",
    "huggingface_hub==1.12.0",
    "matplotlib==3.10.9",
    "nltk==3.9.4",
    "numpy==2.4.4",
    "open_clip_torch==3.3.0",
    "pandas==3.0.2",
    "perception-models",
    "pillow==11.3.0",
    "pycocotools==2.0.11",
    "pyyaml==6.0.3",
    "regex==2026.4.4",
    "requests==2.33.1",
    "safetensors==0.7.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "timm==1.0.26",
    "tokenizers==0.22.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm==4.67.3",
    "transformers==5.7.0",
]

[dependency-groups]
dev = [
    "pypdf==6.10.2",
    "pytest==9.0.3",
]

[tool.uv]
# The code runs from this folder, so the project itself is not installed as a package.
package = false

[tool.uv.sources]
perception-models = { git = "https://github.com/facebookresearch/perception_models.git", rev = "3e352cca660658d4b5c90f42a7808b11469e4c66" }

# PE-Core's package pins many packages this project does not use, including decord, which has
# no Python 3.12 wheel. Declaring it with no dependencies has the same effect as pip's --no-deps.
[[tool.uv.dependency-metadata]]
name = "perception-models"
version = "1.0.0"
requires-dist = []
